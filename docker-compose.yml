services:
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./services/web:/web
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASSWORD=changeme
      - DB_PORT=5432
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  projects:
    build:
      context: ./services/projects
      dockerfile: dockerfile
      args:
        DEV: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./services/projects:/app
    command: >
      sh -c "flask --app app.main:create_app run --host=0.0.0.0 --port=5000
      --debug"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "devdb", "-U", "devuser" ]

volumes:
  dev-db-data:
