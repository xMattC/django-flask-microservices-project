# ------------------------------------------------------------------
# Docker Services Configuration for Django + Flask Microservices Project
# ------------------------------------------------------------------
services:
  # ------------------------------------------------------------------
  # Django BFF (auth, UI, orchestration)
  # ------------------------------------------------------------------
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./services/web:/web
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=web-db
      - DB_NAME=web_db
      - DB_USER=web_user
      - DB_PASSWORD=changeme
      - DB_PORT=5432
      - DEBUG=1
    depends_on:
      web-db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Django BFF - PostgreSQL database
  # ------------------------------------------------------------------
  web-db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - web-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=web_db
      - POSTGRES_USER=web_user
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "web_db", "-U", "web_user" ]

  # ------------------------------------------------------------------
  # Flask Projects Microservice (owns project data + logic)
  # ------------------------------------------------------------------
  projects:
    build:
      context: ./services/projects
      dockerfile: dockerfile
      args:
        DEV: "true"
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./services/projects:/app
    command: >
      sh -c "
        flask --app app.main:create_app run --host=0.0.0.0 --port=5000 --debug
      "
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
      - DB_HOST=projects-db
      - DB_NAME=projects_db
      - DB_USER=projects_user
      - DB_PASSWORD=changeme
      - DB_PORT=5432
    depends_on:
      projects-db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Flask Projects Microservice - PostgreSQL Database
  # ------------------------------------------------------------------
  projects-db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - projects-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=projects_db
      - POSTGRES_USER=projects_user
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "projects_db", "-U", "projects_user" ]

  # ------------------------------------------------------------------
  # Flask Time Tracking Microservice (owns time tracking data + logic)
  # ------------------------------------------------------------------
  time-tracking:
    build:
      context: ./services/time-tracking
      dockerfile: dockerfile
      args:
        DEV: "true"
    working_dir: /app
    ports:
      - "5001:5000"
    volumes:
      - ./services/time-tracking:/app
    command: >
      sh -c "
        flask --app app.main:create_app run --host=0.0.0.0 --port=5000 --debug
      "
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
      - DB_HOST=time-tracking-db
      - DB_NAME=time_tracking_db
      - DB_USER=time_tracking_user
      - DB_PASSWORD=changeme
      - DB_PORT=5432
    depends_on:
      time-tracking-db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Flask Time Tracking Microservice - PostgreSQL Database
  # ------------------------------------------------------------------
  time-tracking-db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - time-tracking-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=time_tracking_db
      - POSTGRES_USER=time_tracking_user
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "time_tracking_db", "-U", "time_tracking_user" ]

# ------------------------------------------------------------------
# Docker volumes for data persistence
# ------------------------------------------------------------------
volumes:
  web-db-data:
  projects-db-data:
  time-tracking-db-data: