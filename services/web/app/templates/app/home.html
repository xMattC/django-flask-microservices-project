{% extends "base.html" %}

{% block content %}

<div class="text-center mt-5">
  <h1 class="display-5 mb-3">Welcome to Project</h1>
  <p class="lead text-muted mb-4">
    A few words about the project.
  </p>

  {% if not request.user.is_authenticated %}
    <a href="{% url 'user:login' %}" class="btn btn-primary me-2">
      Login
    </a>
    <a href="{% url 'user:register' %}" class="btn btn-outline-primary">
      Register
    </a>
  {% else %}
    <a href="{% url 'app:dashboard' %}" class="btn btn-primary">
      Go to Dashboard
    </a>
  {% endif %}
</div>

{% endblock %}
