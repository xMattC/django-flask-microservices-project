{% if task_list %}

  {% for task in task_list %}

    <article class="task-item">

      <div class="d-flex align-items-center justify-content-between gap-3">

        <h6 class="task-title mb-0">
          {{ task.task_name }}
        </h6>

        <button
          type="button"
          class="btn btn-sm btn-outline-primary task-view-button"
          data-bs-toggle="modal"
          data-bs-target="#task-detail-modal"
          data-task-id="{{ task.id }}">
          View
        </button>

      </div>

      <script
        id="task-data-{{ task.id }}"
        type="application/json">
        {
          "id": {{ task.id }},
          "task_name": "{{ task.task_name|escapejs }}",
          "description": "{{ task.description|default:''|escapejs }}",
          "state": "{{ task.state|escapejs }}"
        }
      </script>

    </article>

  {% endfor %}

{% else %}

  <div class="task-empty-state">

    <div class="task-empty-state-icon">
      <i class="bi bi-card-checklist"></i>
    </div>

    <h6 class="mb-2">
      {{ empty_title }}
    </h6>

    <p class="mb-0">
      {{ empty_message }}
    </p>

  </div>

{% endif %}
