<div class="d-flex align-items-center gap-2 flex-wrap">

  <div class="input-group project-select-group">

    <span class="input-group-text bg-white border-end-0">
      <i class="bi bi-folder2-open text-primary"></i>
    </span>

    <form method="post" class="mb-0 flex-grow-1">
      {% csrf_token %}

      <input type="hidden" name="form_type" value="select_project">

      <select
        id="project-selector"
        name="project_id"
        class="form-select border-start-0 ps-0"
        onchange="this.form.submit()">

        <option value="">Select project</option>

        {% for project in projects %}
          <option
            value="{{ project.id }}"
            {% if selected_project and project.id == selected_project.id %}selected{% endif %}>
            {{ project.name|truncatechars:30 }}
          </option>
        {% endfor %}

      </select>
    </form>

  </div>

  {% if selected_project %}
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="collapse"
      data-bs-target="#create-task-panel"
      aria-expanded="{% if task_create_error %}true{% else %}false{% endif %}"
      aria-controls="create-task-panel">
      <i class="bi bi-plus-lg me-1"></i>
      Add Task
    </button>
  {% endif %}

</div>

<style>
  .project-select-group {
    width: min(100%, 360px);
  }

  .project-select-group .input-group-text,
  .project-select-group .form-select {
    min-height: 44px;
    border-color: #dce3eb;
  }

  .project-select-group .input-group-text {
    border-radius: 0.6rem 0 0 0.6rem;
  }

  .project-select-group .form-select {
    border-radius: 0 0.6rem 0.6rem 0;
  }
</style>
