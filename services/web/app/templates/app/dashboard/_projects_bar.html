<div class="d-flex flex-wrap align-items-center gap-3">
  {% if projects_error %}
    <div class="alert alert-danger mb-0">{{ projects_error }}</div>
  {% else %}
    <form method="post" class="d-flex align-items-center gap-3 mb-0">
      {% csrf_token %}
      <input type="hidden" name="form_type" value="select_project">

      <select
        name="project_id"
        class="form-select form-select-lg"
        style="min-width: 280px;"
        onchange="this.form.submit()">
        <option value="">Select project</option>
        {% for project in projects %}
          <option
            value="{{ project.id }}"
            {% if selected_project and project.id == selected_project.id %}selected{% endif %}>
            {{ project.name|truncatechars:30 }}
          </option>
        {% endfor %}
      </select>
    </form>

    {% if has_running_session %}
      <span class="text-success fw-semibold">Clocked-In</span>
    {% endif %}

    <a href="{% url 'app:projects' %}" class="btn btn-sm btn-outline-primary ms-auto">
      Manage projects
    </a>
  {% endif %}
</div>
