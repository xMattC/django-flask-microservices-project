services:
  web:
    build:
      context: ../../services/web
      dockerfile: Dockerfile
      args:
        DEV: "false"
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - DB_HOST=web-db
      - DB_NAME=${WEB_DB_NAME}
      - DB_USER=${WEB_DB_USER}
      - DB_PASSWORD=${WEB_DB_PASSWORD}
      - DB_PORT=5432
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      web-db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static-data:/vol/web/static

  web-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${WEB_DB_NAME}
      - POSTGRES_USER=${WEB_DB_USER}
      - POSTGRES_PASSWORD=${WEB_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${WEB_DB_NAME}", "-U", "${WEB_DB_USER}"]
    volumes:
      - web-db-data:/var/lib/postgresql/data

  projects:
    build:
      context: ../../services/projects
      dockerfile: dockerfile
      args:
        DEV: "false"
    working_dir: /app
    command: >
      sh -c "gunicorn 'app.main:create_app()' --bind 0.0.0.0:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DB_HOST=projects-db
      - DB_NAME=${PROJECTS_DB_NAME}
      - DB_USER=${PROJECTS_DB_USER}
      - DB_PASSWORD=${PROJECTS_DB_PASSWORD}
      - DB_PORT=5432
    depends_on:
      projects-db:
        condition: service_healthy
    expose:
      - "5000"

  projects-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${PROJECTS_DB_NAME}
      - POSTGRES_USER=${PROJECTS_DB_USER}
      - POSTGRES_PASSWORD=${PROJECTS_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${PROJECTS_DB_NAME}", "-U", "${PROJECTS_DB_USER}"]
    volumes:
      - projects-db-data:/var/lib/postgresql/data

  time-tracking:
    build:
      context: ../../services/time-tracking
      dockerfile: dockerfile
      args:
        DEV: "false"
    working_dir: /app
    command: >
      sh -c "gunicorn 'app.main:create_app()' --bind 0.0.0.0:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DB_HOST=time-tracking-db
      - DB_NAME=${TIME_TRACKING_DB_NAME}
      - DB_USER=${TIME_TRACKING_DB_USER}
      - DB_PASSWORD=${TIME_TRACKING_DB_PASSWORD}
      - DB_PORT=5432
    depends_on:
      time-tracking-db:
        condition: service_healthy
    expose:
      - "5000"

  time-tracking-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${TIME_TRACKING_DB_NAME}
      - POSTGRES_USER=${TIME_TRACKING_DB_USER}
      - POSTGRES_PASSWORD=${TIME_TRACKING_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${TIME_TRACKING_DB_NAME}", "-U", "${TIME_TRACKING_DB_USER}"]
    volumes:
      - time-tracking-db-data:/var/lib/postgresql/data

  tasks:
    build:
      context: ../../services/tasks
      dockerfile: dockerfile
      args:
        DEV: "false"
    working_dir: /app
    command: >
      sh -c "flask --app app.main:create_app run --host 0.0.0.0 --port 5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DB_HOST=tasks-db
      - DB_NAME=${TASKS_DB_NAME}
      - DB_USER=${TASKS_DB_USER}
      - DB_PASSWORD=${TASKS_DB_PASSWORD}
      - DB_PORT=5432
    depends_on:
      tasks-db:
        condition: service_healthy
    expose:
      - "5000"

  tasks-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${TASKS_DB_NAME}
      - POSTGRES_USER=${TASKS_DB_USER}
      - POSTGRES_PASSWORD=${TASKS_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${TASKS_DB_NAME}", "-U", "${TASKS_DB_USER}"]
    volumes:
      - tasks-db-data:/var/lib/postgresql/data

volumes:
  web-db-data:
  projects-db-data:
  time-tracking-db-data:
  tasks-db-data:
  static-data: