name: time-tracking Checks

on:
  pull_request:
    paths:
      - "services/time-tracking/**"
      - "docker-compose.yml"
      - ".github/workflows/time-tracking-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/time-tracking/**"
      - "docker-compose.yml"
      - ".github/workflows/time-tracking-ci.yml"

jobs:
  time-tracking-check:
    name: time-tracking Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build time-tracking service
        run: docker compose build time-tracking

      - name: Test
        run: docker compose run --rm time-tracking python -m pytest

      - name: Lint
        run: docker compose run --rm time-tracking flake8
