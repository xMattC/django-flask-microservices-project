name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy live site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/ec2_key << 'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/ec2_key

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

              set -e

              COMPOSE_FILES="-f docker-compose.yml -f docker-compose-deploy.yml"

              cd "${{ secrets.EC2_PROJECT_DIR }}"

              git fetch origin main
              git reset --hard origin/main

              docker compose ${COMPOSE_FILES} config

              test -f /etc/letsencrypt/live/productivity-app.xmattc.com/fullchain.pem
              test -f /etc/letsencrypt/live/productivity-app.xmattc.com/privkey.pem

              # Reduce peak memory use on the EC2 instance.
              export COMPOSE_PARALLEL_LIMIT=1

              echo "Building services sequentially..."

              docker compose ${COMPOSE_FILES} build web
              docker compose ${COMPOSE_FILES} build projects
              docker compose ${COMPOSE_FILES} build time-tracking
              docker compose ${COMPOSE_FILES} build tasks

              echo "Starting containers..."

              docker compose ${COMPOSE_FILES} up -d --no-build

              echo "Waiting for services to start..."
              sleep 15

              docker compose ${COMPOSE_FILES} exec -T web \
                python manage.py migrate

              docker compose ${COMPOSE_FILES} exec -T projects \
                flask --app app.main:create_app db upgrade

              docker compose ${COMPOSE_FILES} exec -T time-tracking \
                flask --app app.main:create_app db upgrade

              docker compose ${COMPOSE_FILES} exec -T tasks \
                flask --app app.main:create_app db upgrade

              FAILED_CONTAINERS=$(docker compose ${COMPOSE_FILES} ps \
                --format '{{.Name}} {{.State}}' \
                | grep -E 'exited|restarting|dead' || true)

              if [ -n "$FAILED_CONTAINERS" ]; then
                echo "ERROR: One or more containers failed after startup:"
                echo "$FAILED_CONTAINERS"
                docker compose ${COMPOSE_FILES} logs --tail=150
                exit 1
              fi

              docker compose ${COMPOSE_FILES} ps

              curl -fsS http://localhost > /dev/null
              curl -fsS https://productivity-app.xmattc.com > /dev/null

              docker image prune -f

          EOF